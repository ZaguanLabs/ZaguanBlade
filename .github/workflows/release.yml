name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # Check job: type-check, lint, and test on one platform before
  # spending runner minutes on the full multi-platform matrix.
  # ------------------------------------------------------------------
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libpipewire-0.3-dev libgbm-dev libegl-dev libxcb1-dev rpm xdg-utils

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: make install-deps

      - name: show build tool versions
        run: |
          bun --version
          rustc --version
          cargo --version
          bun tauri --version

      - name: ci checks (type-check + lint + test)
        run: make ci-check

  # ------------------------------------------------------------------
  # Build job: full release build on every target arch / OS.
  # Uses the Makefile ci-build target with TARGET/BUNDLES overrides.
  # The tauri-action wraps the build for GitHub release publishing.
  # ------------------------------------------------------------------
  build:
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64 (Apple Silicon)
          - platform: 'macos-15'
            rust_target: 'aarch64-apple-darwin'
            bundles: 'app dmg'
          # macOS x86_64 (Intel)
          - platform: 'macos-13'
            rust_target: 'x86_64-apple-darwin'
            bundles: 'app dmg'
          # Linux x86_64
          - platform: 'ubuntu-24.04'
            rust_target: ''
            bundles: 'appimage deb rpm'
            release_arch: 'amd64'
          # Linux ARM64
          - platform: 'ubuntu-24.04-arm'
            rust_target: ''
            bundles: 'appimage deb rpm'
            release_arch: 'arm64'
          # Windows x86_64
          - platform: 'windows-latest'
            rust_target: ''
            bundles: 'nsis msi'
          # Windows ARM64
          - platform: 'windows-latest'
            rust_target: 'aarch64-pc-windows-msvc'
            bundles: 'nsis msi'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libpipewire-0.3-dev libgbm-dev libegl-dev libxcb1-dev rpm xdg-utils

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: install frontend dependencies
        run: make install-deps

      - name: show build tool versions
        run: |
          bun --version
          rustc --version
          cargo --version
          bun tauri --version

      - name: build tauri
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # the action automatically replaces __VERSION__ with the app version
          releaseName: 'v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          tauriScript: bun run tauri
          args: ${{ matrix.rust_target && format('--target {0} ', matrix.rust_target) }}--bundles ${{ matrix.bundles }}

      - name: upload Linux binary archive
        if: startsWith(matrix.platform, 'ubuntu')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ARCH: ${{ matrix.release_arch }}
        shell: bash
        run: |
          version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          archive="ZaguanBlade_${version}_${RELEASE_ARCH}.tar.gz"
          package_dir="$(mktemp -d)"
          trap 'rm -rf "$package_dir"' EXIT

          install -Dm755 src-tauri/target/release/zblade "$package_dir/zblade"
          install -Dm644 LICENSE "$package_dir/LICENSE"
          install -Dm644 README.md "$package_dir/README.md"
          find docs -type f -name '*.md' \
            ! -path 'docs/bugs/*' \
            ! -path 'docs/internal/*' \
            ! -path 'docs/live/*' \
            -exec cp --parents --preserve=mode {} "$package_dir" \;

          tar -czf "$archive" -C "$package_dir" zblade LICENSE README.md docs
          gh release upload "v${version}" "$archive" --clobber
