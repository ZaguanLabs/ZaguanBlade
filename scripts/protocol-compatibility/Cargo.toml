[package]
name = "zblade-protocol-compatibility"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
publish = false

# Check broader SDK feature sets in a separate dependency graph while keeping
# the shared SDK versions aligned with the application.
[dev-dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest", "auth", "elicitation"] }
agent-client-protocol = { version = "=3.3.0", default-features = false }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "io-util", "time", "process"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
serde_json = "1.0.154"

[[test]]
name = "protocols"
path = "tests/protocols.rs"
