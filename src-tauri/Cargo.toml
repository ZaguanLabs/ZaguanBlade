[package]
name = "zblade"
version = "0.8.3"
description = "Zaguán Blade - A versatile AI code editor"
authors = ["Zaguán Labs"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zblade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-notification = "2.3.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
# M4.3 — span-preserving YAML reader for correct config-key line/col positions
# (serde_yaml 0.9 discards source spans). Small, purpose-built to retain
# per-node line/col markers; tolerates duplicate keys.
marked-yaml = "0.8"
reqwest = { version = "0.13.3", features = ["json", "stream"] }
tokio = { version = "1.52.3", features = ["full"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
regex = "1.12.2"
walkdir = "2.5.0"
directories = "6.0.0"
futures-util = "0.3"
dotenvy = "0.15"
portable-pty = "0.9.0"
lazy_static = "1.4"
dirs = "6.0.0"
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
uuid = { version = "1.23.4", features = ["v4", "serde"] }
clap = { version = "4.6.1", features = ["derive"] }
glob = "0.3"
rusqlite = { version = "0.39", features = ["bundled"] }
notify = "8"
ignore = "0.4"
similar = "3.1.0"
gix = "0.85.0"

# Tree-sitter for AST parsing (ZLP - Zaguán Language Protocol)
tree-sitter = "0.26.10"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25.0"
tree-sitter-cpp = "0.23.4"

# M5.6 — mimalloc returns freed memory to the OS promptly (glibc malloc retains
# it), lowering steady-state peak RSS during large indexes (e.g. the kernel).
mimalloc = "0.1.52"

# M6 CL1 — xxh3: a version-stable content hash for persisted fingerprints
# (indexed_files.file_hash, the reconcile checkpoint, the project-state filename).
# Unlike std's SipHash DefaultHasher, xxh3 output is fixed across Rust toolchains.
xxhash-rust = { version = "0.8", features = ["xxh3"] }

base64 = "0.22.1"
xcap = "0.9.4"
image = "0.25"

[features]
default = []
devtools = ["tauri/devtools"]

[profile.release]
panic = "abort" # Strip expensive panic clean-up logic
codegen-units = 1 # Compile more slowly, but better optimization
lto = true # Enable Link Time Optimization
opt-level = 3 # Optimize for speed
strip = false # Do not strip symbols (required for Tauri bundler type injection)

[dev-dependencies]
tempfile = "3.24.0"
