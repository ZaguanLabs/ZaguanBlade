[package]
name = "zblade"
version = "0.9.1"
description = "Zaguán Blade - A versatile AI code editor"
authors = ["Zaguán Labs"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zblade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-notification = "2.3.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
# M4.3 — span-preserving YAML reader for correct config-key line/col positions
# (serde_yaml 0.9 discards source spans). Small, purpose-built to retain
# per-node line/col markers; tolerates duplicate keys.
marked-yaml = "0.8"
reqwest = { version = "0.13.3", features = ["json", "stream"] }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "fs", "process", "net", "sync", "time", "macros", "io-util"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
regex = "1.12.2"
walkdir = "2.5.0"
directories = "6.0.0"
futures-util = "0.3"
portable-pty = "0.9.0"

tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
uuid = { version = "1.23.4", features = ["v4", "serde"] }
clap = { version = "4.6.1", features = ["derive"] }
glob = "0.3"
rusqlite = { version = "0.39", features = ["bundled"] }
notify = "8"
ignore = "0.4"
similar = "3.1.0"
gix = "0.85.0"
keyring = "4.1.4"

# Tree-sitter for AST parsing (ZLP - Zaguán Language Protocol)
tree-sitter = "0.26.10"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25.0"
tree-sitter-cpp = "0.23.4"

# M5.6 — mimalloc returns freed memory to the OS promptly (glibc malloc retains
# it), lowering steady-state peak RSS during large indexes (e.g. the kernel).
mimalloc = "0.1.52"

# Warmup context prefetch — the zcoderd warmup contract requires a SHA-256
# hash of the exact sent bytes on every content-bearing bundle item.
sha2 = "0.11"

# M6 CL1 — xxh3: a version-stable content hash for persisted fingerprints
# (indexed_files.file_hash, the reconcile checkpoint, the project-state filename).
# Unlike std's SipHash DefaultHasher, xxh3 output is fixed across Rust toolchains.
xxhash-rust = { version = "0.8", features = ["xxh3"] }

base64 = "0.22.1"
xcap = "0.9.4"
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
default = []
devtools = ["tauri/devtools"]

[profile.release]
panic = "abort" # Strip expensive panic clean-up logic
codegen-units = 1 # Compile more slowly, but better optimization
lto = true # Enable Link Time Optimization
opt-level = 3 # Optimize for speed
strip = "symbols" # Strip debug symbols and symbol tables from the shipped binary

# Profiling build: release-equivalent optimization with symbols for perf/flamegraph.
# Use `cargo build --profile profiling` to produce a symbol-rich binary.
[profile.profiling]
inherits = "release"
strip = false
debug = true

[dev-dependencies]
tempfile = "3.24.0"

# Lint debt inventory from the first strict clippy run (rust 1.97.0, CI gate
# added 2026-07-10, first triggered by the v0.9.0 tag): 160 findings across
# these families, all pre-existing. They are allowed here so `-D warnings`
# stays a hard gate for NEW lint classes while the debt is paid down
# incrementally — remove entries as their findings are fixed. The clippy
# version is pinned in .github/workflows/release.yml; bump both together.
# clippy.toml's disallowed_types/disallowed_methods are NOT allowed here:
# those are deliberate project rules.
[lints.clippy]
cloned_ref_to_slice_refs = "allow"
collapsible_if = "allow"
derivable_impls = "allow"
doc_lazy_continuation = "allow"
double_ended_iterator_last = "allow"
empty_line_after_doc_comments = "allow"
explicit_auto_deref = "allow"
field_reassign_with_default = "allow"
inherent_to_string = "allow"
large_enum_variant = "allow"
len_without_is_empty = "allow"
len_zero = "allow"
let_and_return = "allow"
manual_clamp = "allow"
manual_ok_err = "allow"
manual_pattern_char_comparison = "allow"
manual_repeat_n = "allow"
manual_strip = "allow"
map_flatten = "allow"
match_like_matches_macro = "allow"
missing_const_for_thread_local = "allow"
multiple_bound_locations = "allow"
needless_borrow = "allow"
needless_borrows_for_generic_args = "allow"
needless_return = "allow"
new_without_default = "allow"
obfuscated_if_else = "allow"
ptr_arg = "allow"
question_mark = "allow"
redundant_closure = "allow"
redundant_field_names = "allow"
result_large_err = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
unnecessary_map_or = "allow"
unnecessary_sort_by = "allow"
unnecessary_unwrap = "allow"
useless_conversion = "allow"
useless_format = "allow"
while_let_loop = "allow"
while_let_on_iterator = "allow"
