[package]
name = "zblade"
version = "0.8.1"
description = "Zaguán Blade - A versatile AI code editor"
authors = ["Zaguán Labs"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zblade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-notification = "2.3.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13.3", features = ["json", "stream"] }
tokio = { version = "1.52.3", features = ["full"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
futures = "0.3"
regex = "1.12.2"
walkdir = "2.5.0"
directories = "6.0.0"
futures-util = "0.3"
dotenvy = "0.15"
portable-pty = "0.9.0"
lazy_static = "1.4"
dirs = "6.0.0"
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
clap = { version = "4.6.1", features = ["derive"] }
glob = "0.3"
rusqlite = { version = "0.39", features = ["bundled"] }
notify = "8"
ignore = "0.4"
diffy = "0.5.0"
similar = "3.1.0"
gix = "0.83.0"
bstr = "1.12.1"

# Tree-sitter for AST parsing (ZLP - Zaguán Language Protocol)
tree-sitter = "0.26.8"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25.0"

base64 = "0.22.1"
xcap = "0.9.4"
image = "0.25"

[features]
default = []
devtools = ["tauri/devtools"]

[profile.release]
panic = "abort" # Strip expensive panic clean-up logic
codegen-units = 1 # Compile more slowly, but better optimization
lto = true # Enable Link Time Optimization
opt-level = 3 # Optimize for speed
strip = false # Do not strip symbols (required for Tauri bundler type injection)

[dev-dependencies]
tempfile = "3.24.0"
